[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailbox-shape"
version = "0.1.0"
description = "Statistics on the shape, size, and flow of a Microsoft 365 mailbox via Microsoft Graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeff Mealiffe" }]
dependencies = [
    "msal>=1.28",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mailbox-shape = "mailbox_shape.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailbox_shape"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
